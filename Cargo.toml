[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
authors = ["Ikuma Yamashita"]
repository = "https://github.com/46ki75/mcp-rust-docs"

[workspace.dependencies]
rmcp = { version = "1.7", features = [
    "server",
    "macros",
    "transport-io",
    "transport-streamable-http-server",
    "schemars",
] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "io-std",
] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
fast_html2md = "0.0.62"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wiremock = "0.6"
ruzstd = { version = "0.9", default-features = false, features = ["std"] }
# docs.rs serves rustdoc-JSON at multiple schema versions depending on
# when each crate was last built. We support the two versions currently
# in circulation by pulling both crates in via cargo's package-rename
# feature, then dispatching at deserialize time on the JSON's
# `format_version` field. Adding a new version: bump the primary pin,
# add a `rustdoc-types-NN` rename for the previous version, add the
# matching From impl and dispatch arm in `docs_rs/schema.rs`, and add
# a format-NN fixture under `tests/fixtures/`.
rustdoc-types = "0.61"
rustdoc-types-56 = { package = "rustdoc-types", version = "=0.56.0" }
moka = { version = "0.12", features = ["future"] }
# Vercel deployment entry point (crates/mcp-rust-docs-vercel) only.
vercel_runtime = { version = "2.4", features = ["axum"] }
tower = "0.5"

[workspace.lints.clippy]
unwrap_used = "deny"
