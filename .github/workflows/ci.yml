name: ci

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref. Saves CI minutes on busy branches
# without dropping protection on main (each push there is its own ref).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Honors rust-toolchain.toml (currently pinned to 1.90), installs
      # rustfmt + clippy as declared there, and sets up cargo caching.
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: taiki-e/install-action@v2.86.5
        with:
          tool: just

      - name: just ci
        run: just ci
